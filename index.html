  <style>
:root{color-scheme:light;--bg:#f5f5f7;--panel:#fff;--text:#1d1d1f;--muted:#707078;--hair:#e8e8ed;--accent:#1472d4;--shade:#edf3fb;--warn:#b17b27;--alert:#c53f41;--unknown:#96969e}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#101114;--panel:#202125;--text:#f6f6f8;--muted:#aaaab4;--hair:#35363d;--accent:#84baff;--shade:#2a3849;--warn:#ebb65d;--alert:#f0787c;--unknown:#85858d}}
:root[data-theme=dark]{color-scheme:dark;--bg:#101114;--panel:#202125;--text:#f6f6f8;--muted:#aaaab4;--hair:#35363d;--accent:#84baff;--shade:#2a3849;--warn:#ebb65d;--alert:#f0787c;--unknown:#85858d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,a{font:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app-shell{max-width:1120px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(52px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.mast-actions{display:flex;gap:7px;flex:0 0 auto}
.icon-button{width:44px;height:44px;border:0;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.icon-button svg{width:19px;height:19px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-height:44px}
.modes{display:flex;border-radius:11px;padding:3px;background:var(--panel);gap:2px;flex:0 0 auto}
.modes button{border:0;background:transparent;border-radius:8px;min-height:44px;padding:5px 11px;font-size:13px;font-weight:550}
.modes button[aria-pressed=true]{background:var(--shade);color:var(--accent)}
.update{font-size:11px;color:var(--muted);text-align:right;line-height:1.25}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
h1{font-size:19px;line-height:1.2;letter-spacing:-.35px;font-weight:650;margin:0}
.heading-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0;text-align:right}
.heading p{font-size:12px;margin:0;color:var(--muted);text-align:right}
@media(max-width:374px){h1{font-size:17px}.modes button{padding-left:9px;padding-right:9px;font-size:12px}.toolbar{gap:6px}.mast-actions{gap:4px}}
.layout{display:block}
.timeline{display:grid;gap:8px;min-width:0}
.day-card{scroll-margin-top:16px;background:var(--panel);border-radius:15px;overflow:hidden;min-width:0;border:1px solid transparent}
.day-card.is-open{border-color:var(--hair)}
.day-button{touch-action:manipulation;display:block;width:100%;border:0;background:none;text-align:left;padding:13px 13px 12px;min-height:83px}
.day-main{display:flex;align-items:center;gap:10px;min-width:0}
.day-date{width:46px;flex:0 0 46px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.3;color:var(--muted)}
.day-date .num{font-size:16px;font-weight:600;letter-spacing:-.2px;color:var(--text);font-variant-numeric:tabular-nums}
.day-date .month{font-size:11px}
.day-summary{min-width:0;flex:1}
.day-title{font-size:14px;font-weight:620;line-height:1.24;letter-spacing:-.12px;overflow-wrap:anywhere}
.day-route{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.32;overflow-wrap:anywhere}
.day-weather{width:68px;flex:0 0 68px;text-align:right;display:grid;grid-template-columns:23px 1fr;align-items:center;gap:3px}
.day-weather svg{height:22px;width:22px;color:#8aa5bc}
.day-weather .reading{font-size:18px;font-weight:580;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.1}
.day-weather .feel{grid-column:1/-1;font-size:11px;color:var(--muted);line-height:1.25}
.chevron{height:16px;width:16px;flex:0 0 16px;color:var(--muted);transition:transform .16s ease}
.is-open .chevron{transform:rotate(90deg)}
.day-glance{margin:9px 0 0 56px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;align-items:center}
.glance{min-width:0;display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);white-space:nowrap}
.glance svg{width:15px;height:15px;flex:0 0 15px;color:var(--muted)}
.glance strong{font-size:11px;color:var(--text);font-weight:520;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.glance.warn strong,.glance.warn svg{color:var(--warn)}
.glance.alert strong,.glance.alert svg{color:var(--alert)}
.day-details{padding:0 14px 15px}
.detail-inner{container-type:inline-size;border-top:1px solid var(--hair);padding-top:10px;display:grid;gap:9px}

  function ssb95(json){
    // JSON-stat2, zoek 95-octaan en nieuwste maand; geen getal tonen als dit niet kan.
    if(!Array.isArray(json?.id)||!Array.isArray(json?.size)||!Array.isArray(json?.value))return null;
    const axes=json.id.map((id,pos)=>{
      const cat=json.dimension?.[id]?.category||{};
      return {pos,values:Object.entries(cat.index||{}).map(([code,i])=>
        ({code,i:Number(i),label:String(cat.label?.[code]||code)}))};
    });
    const product=axes.map(a=>({...a,hit:a.values.find(v=>/95/.test(v.label)&&!/(diesel|98)/i.test(v.label))})).find(a=>a.hit);
    const time=axes.map(a=>({...a,months:a.values.filter(v=>/^\d{4}M(?:0[1-9]|1[0-2])$/.test(v.code))})).find(a=>a.months.length);
    if(!product||!time)return null;
    const month=time.months.sort((a,b)=>b.code.localeCompare(a.code))[0];
    let index=0,stride=1;
    for(let i=json.size.length-1;i>=0;i--){
      index+=(i===product.pos?product.hit.i:i===time.pos?month.i:0)*stride;
      stride*=json.size[i];
    }
    const price=Number(json.value[index]);
    return price>=10&&price<=50?{price,currency:'NOK',date:month.code,type:'Maandgemiddelde · SSB'}:null;
  }
  async function loadFuel(c){
    if(!FUEL_URL[c]||fuelPrices.has(c)&&Date.now()-fuelPrices.get(c).checked<12*3600000)return;
    if(fuelPending.has(c))return fuelPending.get(c);
    if(Date.now()-(fuelAttempts.get(c)||0)<10*60000)return;
    fuelAttempts.set(c,Date.now());
    const job=(async()=>{
      let item=null;
      if(c==='no'){
        item=ssb95(await getJSON('https://data.ssb.no/api/pxwebapi/v2/tables/09654/data?lang=en',12000));
      }else if(c==='dk'){
        const json=await getJSON('https://www.fuel-prices.eu/live/api.php?action=summary',12000);
        const d=json?.data?.countries?.find(x=>x.country_code==='DK'&&x.live);
        const price=Number(d?.fuels?.sp95?.avg),at=Number(d?.last_fetched_ts)*1000;
        if(price>=0.5&&price<=4&&Number(d?.fuels?.sp95?.stations)>30&&
          Number.isFinite(at)&&Math.abs(Date.now()-at)<72*3600000)
          item={price,currency:'EUR',date:new Date(at).toISOString().slice(0,10),type:'Actueel pompprijsgemiddelde'};
      }else{
        const json=await getJSON('https://www.fuel-prices.eu/lang/api/country-history.php?cc='+c.toUpperCase(),12000);
        if(Array.isArray(json?.labels)&&Array.isArray(json?.e95)){
          for(let i=Math.min(json.labels.length,json.e95.length)-1;i>=0;i--){
            const price=Number(json.e95[i]),date=json.labels[i],age=Date.now()-Date.parse(date+'T12:00:00Z');
            if(price>=0.5&&price<=4&&/^\d{4}-\d{2}-\d{2}$/.test(date)&&age>=0&&age<28*86400000){
              item={price,currency:'EUR',date,type:'Weekgemiddelde · EU'};break;
            }
          }
        }
      }
      if(item)fuelPrices.set(c,{...item,checked:Date.now()});
    })().catch(()=>{}).finally(()=>{fuelPending.delete(c);updateFuel(c)});
    fuelPending.set(c,job);
    return job;
  }

  // Alleen actuele brondata, geen eigen noorderlichtvoorspellingen of webscraping.
  // NOAA OVATION is een kortetermijnmodel voor aurora direct boven de plaats;
  // Kp is wereldwijd, Open-Meteo levert bewolking op de huidige locatie.
  const auroraState={oval:null,kp:null,ovalAt:0,kpAt:0,cloud:new Map(),pending:null};
  const NOAA_OVAL='https://services.swpc.noaa.gov/json/ovation_aurora_latest.json';
  const NOAA_KP='https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json';
  const auroraTime=t=>{
    if(typeof t!=='string')return null;
    const parsed=Date.parse(t.includes('T')?t:t.replace(' ','T')+'Z');
    return Number.isFinite(parsed)?parsed:null;
  };
  function localOval(d){
    const o=auroraState.oval;
    if(!o || !Array.isArray(o.coordinates) || o.coordinates.length<100)return null;
    const time=auroraTime(o['Forecast Time']);
    // Oude nowcasts nooit presenteren als een actuele voorspelling.
    if(time===null || Math.abs(Date.now()-time)>90*60000)return null;
    const longitude=(d.lon+360)%360;
    let best=null,minimum=Infinity;
    for(const c of o.coordinates){
      if(!Array.isArray(c)||c.length<3)continue;
      const x=Number(c[0]),y=Number(c[1]),value=Number(c[2]);
      if(!Number.isFinite(x)||!Number.isFinite(y)||!Number.isFinite(value))continue;
      const dx=Math.min(Math.abs(x-longitude),360-Math.abs(x-longitude));
      const distance=dx*dx+Math.pow(y-d.lat,2);
      if(distance<minimum){minimum=distance;best=value;}

  async function fetchAurora(force=false){
    if(auroraState.pending)return auroraState.pending;

    const now=Date.now(),id=locationId(d),jobs=[];

          <span class="glance">${ico('wind')}<strong>${fmt(w?.gust)}</strong></span>
          <span class="glance">${ico('snow')}<strong>${fmt(w?.snow)}</strong></span>
          <span class="glance">${ico('sunrise')}<strong>${readableSun(d,'length')}</strong></span>
          <span class="glance">${ico('road')}<strong>${roadGlance(d)}</strong></span>
        </div></button>
        <div class="day-details" id="detail-${esc(d.id)}" ${open?'':'hidden'}>${open?detailContent(d):''}</div></article>`;
    }).join('');
    $('timeline').innerHTML=cards+(mode==='trip'&&RETURN?`<div class="return-card">${ico('road')}<span>${esc(RETURN)}</span></div>`:'');
    $('sideDetail').innerHTML=detailContent(arr.find(d=>d.id===selected));
    bindCameraFallbacks();
    const fuelDay=arr.find(d=>d.id===selected);
    if(fuelDay)loadFuel(fuelCountry(fuelDay)).catch(()=>{});
    fetchAurora().catch(()=>{});
    const selectedRoadDay=days().find(x=>x.id===selected);if(selectedRoadDay)fetchRoadAlerts(selectedRoadDay).catch(()=>{});
    $('timeline').querySelectorAll('[data-select]').forEach(btn=>btn.addEventListener('click',()=>{
      const id=btn.dataset.select;
      if(id!==selected){
        selected=id;
        scrollSyncPausedUntil=Date.now()+900;
        render();
        $('sideDetail').scrollTop=0;
      }
      // De geselecteerde dag gaat op smalle schermen naar boven.
      // Op brede schermen blijft de gekozen dag in beeld zonder grote sprong.
      const card=[...$('timeline').querySelectorAll('.day-card')].find(el=>el.dataset.id===id);
      if(card)requestAnimationFrame(()=>card.scrollIntoView({
        block:desktopLayout.matches?'nearest':'start',
        behavior:reduceMotion.matches?'auto':'smooth'
      }));
    }));
  }
  async function getJSON(url,timeout=10000){
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),timeout);
    try{const res=await fetch(url,{signal:ac.signal,cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);return await res.json()}finally{clearTimeout(t)}
  }
  async function mapConcurrent(items,limit,handler){let i=0;const jobs=Array.from({length:Math.min(limit,items.length)},async()=>{while(i<items.length){const item=items[i++];try{await handler(item)}catch{lastError=true}}});await Promise.all(jobs)}
  async function getWeather(d,force=false){
    const key=dataKey(d);if(!force && fresh(d))return;
    const q=new URLSearchParams({latitude:String(d.lat),longitude:String(d.lon),daily:WEATHER_DAILY_FIELDS,hourly:WEATHER_HOURLY_FIELDS,timezone:LOCAL_TZ(d),forecast_days:'16'});
    const out=await getJSON('https://api.open-meteo.com/v1/forecast?'+q,11000);
    const dateIdx=out?.daily?.time?.indexOf(d.date)??-1;
    if(dateIdx<0)return;
    const val=k=>out?.daily?.[k]?.[dateIdx];
    // Gemiddelde bewolking van de geselecteerde avond 18:00 tot de volgende ochtend 06:00 (lokale tijd).
    const hourly=out?.hourly||{},nextDay=addDays(d.date,1),night=[];
    if(Array.isArray(hourly.time)&&Array.isArray(hourly.cloud_cover)){
      hourly.time.forEach((t,i)=>{
        if(typeof t!=='string')return;
        const day=t.slice(0,10),hour=Number(t.slice(11,13)),v=n(hourly.cloud_cover[i]);
        if((day===d.date&&hour>=18)||(day===nextDay&&hour<6)){
          if(v!==null&&v>=0&&v<=100)night.push(v);
        }
      });
    }
    const phase=n(val('moon_phase'));
    const moonlight=phase!==null&&phase>=0&&phase<=1?Math.round((1-Math.cos(phase*Math.PI*2))*50):null;
    weatherCache[key]={when:Date.now(),value:{
      temp:n(val('temperature_2m_mean')),feel:n(val('apparent_temperature_mean')),
      icon:codeIcon(val('weather_code')),gust:n(val('wind_gusts_10m_max')),
      snow:n(val('snowfall_sum')),cloud:n(val('cloud_cover_mean')),
      humidity:n(val('relative_humidity_2m_mean')),
      nightCloud:night.length>=9?Math.round(night.reduce((a,b)=>a+b,0)/night.length):null,
      moonlight
    }};
    safePut('weather',weatherCache);render();
  }
  async function getSun(d){
    const key=dataKey(d);if(sunCache[key])return;
    const out=await getJSON('https://api.sunrise-sunset.org/v2?'+new URLSearchParams({lat:String(d.lat),lng:String(d.lon),date:d.date}),12000);
    if(!['normal','polar_night','midnight_sun'].includes(out?.sun_status))throw Error('Onbekende zonstatus');
    sunCache[key]={when:Date.now(),value:{sun_status:out.sun_status,sunrise:out.sunrise,sunset:out.sunset,day_length:out.day_length}};
    safePut('sun',sunCache);render();
  }
  let refreshCycle=0, pendingRefresh=false;
  async function refresh(force=false){
    if(busy){pendingRefresh=true;return;}busy=true;lastError=false;render();
    const arr=days(),cycle=++refreshCycle;
    const uniqueSun=arr.filter((d,i,a)=>!sunCache[dataKey(d)] && a.findIndex(x=>dataKey(x)===dataKey(d))===i);
    const today=dateAtHome();
    const uniqueWeather=arr.filter((d,i,a)=>{ const gap=(Date.parse(d.date+'T12:00:00Z')-Date.parse(today+'T12:00:00Z'))/MS_DAY;return gap>=0 && gap<=15 && (force || !fresh(d)) && a.findIndex(x=>dataKey(x)===dataKey(d))===i;});
    await Promise.all([
      mapConcurrent(uniqueWeather,3,d=>getWeather(d,force)),
      mapConcurrent(uniqueSun,3,d=>getSun(d))
    ]);
    if(cycle===refreshCycle){busy=false;render();if(pendingRefresh){pendingRefresh=false;refresh();}}
  }
  function changeMode(m){mode=m;safePut('mode',mode);selected=null;render();refresh()}
  function changeTheme(){let current=document.documentElement.dataset.theme;if(!current)current=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';const next=current==='dark'?'light':'dark';document.documentElement.dataset.theme=next;safePut('theme',next);$('theme').innerHTML=ico(next==='dark'?'sun':'moon')}
  const theme=safeGet('theme','auto');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;
  $('refresh').innerHTML=ico('refresh');$('theme').innerHTML=ico(theme==='dark'?'sun':'moon');
  $('refresh').addEventListener('click',()=>{roadcamStamp=Date.now();refresh(true);fetchAurora(true).catch(()=>{});const d=days().find(x=>x.id===selected);if(d)fetchRoadAlerts(d,true).catch(()=>{});});
  $('theme').addEventListener('click',changeTheme);
  $('mode-preview').addEventListener('click',()=>changeMode('preview'));
  $('mode-trip').addEventListener('click',()=>changeMode('trip'));
  render();refresh();
})();

</script>
