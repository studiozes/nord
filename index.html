<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Onze winterroadtrip. De reis en het weer in één overzicht.">
  <title>Nord · Scandinavië 2027</title>
  <meta name="apple-mobile-web-app-title" content="Nord">
  <link rel="icon" type="image/png" href="./assets/icon-v7.png">
  <link rel="apple-touch-icon" href="./assets/icon-v7.png">
  <link rel="stylesheet" href="./assets/nord-v7.css">
  
  
</head>
<body>
  <main class="app-shell">
    <div class="toolbar">
      <div class="modes" role="group" aria-label="Gegevensperiode">
        <button type="button" id="mode-preview" aria-pressed="false">Komende dagen</button>
        <button type="button" id="mode-trip" aria-pressed="true">Reis 2027</button>
      </div>
      <div class="mast-actions">
        <button class="icon-button" id="refresh" type="button" aria-label="Ververs gegevens" title="Ververs gegevens"></button>
        <button class="icon-button" id="theme" type="button" aria-label="Wijzig kleurmodus" title="Wijzig kleurmodus"></button>
      </div>
    </div>
    <div class="heading">
      <h1>Nord <span class="brand-year">2027</span></h1>
      <div class="heading-meta">
        <p id="range">&nbsp;</p>
        <span id="update" class="update" role="status" aria-live="polite">Gegevens laden…</span>
      </div>
    </div>
    <div class="layout">
      <section class="timeline" id="timeline" aria-label="Alle etappes"></section>
      <aside class="side-detail" id="sideDetail" aria-label="Details geselecteerde dag"></aside>
    </div>
  </main>
<script defer src="./assets/plan-v7.js"></script>
<script defer src="./assets/core-v7.js"></script>
<script defer src="./assets/app-v7.js"></script>
</body>
</html>
